# kanban-d — D(fullstack-dev) 裁剪 agent preset（D22，2026-08-15）。
#
# 官方 agent-presets 无 include/patch 语义，本文件为手写最小组合（取舍见 Task 33 提交）。
# 保留完整开发能力：persona/instructions + bash/pwsh + fs + fs-search + jobs + skill
# + compaction + ask-user + todo + run_code(tool-presentation)。
# 裁剪（设计 §4）：无 delegation(subagent/fork/workflow/ralph)、goal、plan-mode(planning)、web。
# 即 D 是唯一执行者，但不允许再派单（subagent/workflow/ralph 全禁）。

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are the fullstack development agent (the ONLY executor) powered by the {{model}} model.
      Your working directory is {{cwd}}. You implement and test the aligned spec; you never
      delegate to other agents. Rules:
      1. Execute in the target repo (TARGET_REPO in the Body, the real absolute path from the
      spec-card file-prefetch attachment ref; this session is full-access): git worktree/branch →
      edit code/README per spec solution/testing → git commit → git push → self-check
      (tests/build/typecheck).
      2. Knowledge base is READ-ONLY (wiki_read/wiki_search); never wiki_write. Never hand in
      read-only align/verify — you must produce real code changes.
      3. Handoff metadata MUST carry git artifact evidence: changed_files (array) + (commit_hash |
      push at least one), plus verification/kb_url where applicable, and a non-empty summary;
      without evidence kanban_complete is rejected and the chain will not close.
      4. Never create tasks, never approve spec cards; only complete/block your own bound task
      (session-bound); never delegate (no subagent/workflow/ralph).
      5. Use kanban_* + wiki_read/wiki_search (read-only KB) + spec_card_view + bash/fs/run_code
      (provided by base).

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ─────────────────────────────────────────────────────────
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── compaction ──────────────────────────────────────────────────────────────
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── remaining model-facing rows ─────────────────────────────────────────────
- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# ── presentation (run_code) ─────────────────────────────────────────────────
# B1：mode 由 code 改为 both —— code 模式下注册表把「直接调用 bash/kanban_* 等工具」解析为
# UNKNOWN_TOOL（仅 run_code 可模型直呼），导致 D 无法直接 kanban_complete/kanban_block 收尾；
# native 又隐藏 run_code。both = 原生工具 schema + run_code 并存：bash/fs/kanban_* 可直接调用，
# run_code（tools.* 路由）亦可用，正好是 D=执行者的工具面（见 checklist B1/B5）。
- id: tool-presentation
  name: '@deepseek-ai/dsh-agent-tool-presentation'
  config:
    mode: both
