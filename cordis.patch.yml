# dsh-swarm bundle patch: kanban service row.
# Applied by the Loader on top of the deployment's own patch layers.
#
# The `kanban` row mounts the node half (src/index.ts apply) with its config.
# The browser half is auto-discovered: this package declares
# `dsh.client.platform: web` (package.json), so the client-modules node half
# composes it into window.__DSH_BOOT__ and serves /plugins/<id>/client.js from
# the package's ./client export (the built lib/client.js bundle).
#
# Personas: the V/P/W/D role texts ship in personas/persona-{v,p,w,d}.md (canonical source)
# and are wired into the runtime via the preset combos personas/kanban-{v,p,w,d}/agent.cordis.yml
# (their persona row carries the system-prompt text). The plugin installs the combos to
# $DSH_HOME/.agent-presets/<id>/ at apply time (src/roles/preset-installer.ts), then
# agentPresets.mount(agentCtx, 'kanban-<role>') is called in the agent factory setup
# (agent-runner.ts for P/W/D, v-orchestrator.ts for V).

- insert:
    - id: kanban
      name: '@joekytc/dsh-swarm'
      config:
        storageDir: !!js dshHomePath("storages/kanban")
        wikiVault:
          baseUrl: 'http://192.168.122.111:3000'
          pagePrefix: 'projects/'
        dispatcher:
          staleTimeoutSeconds: 14400
          maxRetries: 3
          heartbeatIntervalSeconds: 300
        # 角色模型候选链（Task 12）：逐角色 primary + fallbacks，主模型不可用静默切换（[model-fallback] 证据），
        # 全候选不可用 → block(model-unavailable) 抛用户；reasoningEffort 缺省 high。部署实际值以本文件为准。
        roles:
          models:
            v:
              provider: 'ark'
              model: 'deepseek-v4-flash'
              reasoningEffort: 'high'
              fallbacks:
                - provider: 'openai'
                  model: 'gpt-5.6-sol'
                  reasoningEffort: 'high'
            p:
              provider: 'ark'
              model: 'deepseek-v4-flash'
              reasoningEffort: 'high'
              fallbacks:
                - provider: 'openai'
                  model: 'gpt-5.6-sol'
                  reasoningEffort: 'high'
            w:
              provider: 'ark'
              model: 'deepseek-v4-flash'
              reasoningEffort: 'high'
              fallbacks:
                - provider: 'openai'
                  model: 'gpt-5.6-sol'
                  reasoningEffort: 'high'
            d:
              provider: 'ark'
              model: 'deepseek-v4-flash'
              reasoningEffort: 'high'
              fallbacks:
                - provider: 'openai'
                  model: 'gpt-5.6-sol'
                  reasoningEffort: 'high'
            pt:
              provider: 'ark'
              model: 'deepseek-v4-flash'
              reasoningEffort: 'high'
              fallbacks:
                - provider: 'openai'
                  model: 'gpt-5.6-sol'
                  reasoningEffort: 'high'
            dt:
              provider: 'ark'
              model: 'deepseek-v4-flash'
              reasoningEffort: 'high'
              fallbacks:
                - provider: 'openai'
                  model: 'gpt-5.6-sol'
                  reasoningEffort: 'high'
        prefixRoutes:
          plan: '/plan:'
          openspec: '/openspec:'
        ui:
          enabled: true
          contentMinWidth: 715
          contentMaxWidth: 780
          sseHeartbeatSeconds: 20
