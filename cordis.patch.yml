# dsh-kanban bundle patch: kanban service row.
# Applied by the Loader on top of the deployment's own patch layers.
#
# The `kanban` row mounts the node half (src/index.ts apply) with its config.
# The browser half is auto-discovered: this package declares
# `dsh.client.platform: web` (package.json), so the client-modules node half
# composes it into window.__DSH_BOOT__ and serves /plugins/<id>/client.js from
# the package's ./client export (the built lib/client.js bundle).
#
# Personas: the V/P/W/D role texts ship in personas/*.md; mounting them is an
# agent-preset contribution (dsh-persona rows are scope-only and collide when
# mounted at root). Author presets under $DSH_HOME/.agent-presets/<id>/ with an
# agent.cordis.yml that mounts the persona section with the matching text, and
# point config.roles.personaPresets at those preset ids.

- insert:
    - id: kanban
      name: 'dsh-kanban'
      config:
        storageDir: !!js dshHomePath("storages/kanban")
        wikiVault:
          baseUrl: 'http://192.168.122.111:3000'
          pagePrefix: 'projects/'
        dispatcher:
          staleTimeoutSeconds: 14400
          maxRetries: 3
          heartbeatIntervalSeconds: 300
        prefixRoutes:
          plan: '/plan:'
          openspec: '/openspec:'
        ui:
          enabled: true
          contentMaxWidth: 660
          sseHeartbeatSeconds: 20
